[package]
name = "quick-reply"
version = "0.1.0"
edition = "2021"
description = "Unified messaging TUI with AI-powered reply suggestions"
license = "MIT"
repository = "https://github.com/adrewtr/quick-reply"
homepage = "https://github.com/adrewtr/quick-reply"
readme = "README.md"
keywords = ["tui", "messaging", "telegram", "claude", "terminal"]
categories = ["command-line-interface"]

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
tokio-rusqlite = "0.6"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }

# HTTP client (for Slack, sidecar bridges)
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Telegram
grammers-client = "0.9"
grammers-session = "0.9"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
